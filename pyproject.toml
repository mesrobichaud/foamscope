[build-system]
requires = ["setuptools>=77"]     # 77 reads the SPDX license string below
build-backend = "setuptools.build_meta"

[project]
name = "cfdtools"
version = "0.1.0"
description = "Post-processing, plotting, and run-monitoring tools for OpenFOAM cases"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "matplotlib",         # cfdtools.monitor, cfdtools.post
    "pyvista>=0.49",      # cfdtools.post: reads OpenFOAM cases; 0.49 adds UnstructuredGrid.cell_offsets
    "PyFoam>=2026.6",     # cfdtools.post.case_parameters; 2023.7 fails to import on Python 3.12
]

[project.optional-dependencies]
examples = ["gmsh"]               # mesh builders in examples/geometry/: pip install -e ".[examples]"
notebook = ["ipykernel"]          # run the example notebooks: pip install -e ".[notebook]"
test = ["pytest"]

[project.scripts]
foam-monitor = "cfdtools.monitor:main"
foam-pv = "cfdtools.pv:main"

[tool.setuptools.packages.find]
where = ["src"]
